<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Second Brain</title>
<meta name="description" content="A public slice of the owner's notes wiki as a map: approved notes, areas of interest, FirstMate in detail and a harness tier list.">
<style>
/* Dark HUD map. Self-contained: no libraries, no network. Note data comes from notes.js (built by build.py). */
:root{--bg:#05060a;--panel:#0c0e11;--ink:#e9e6e0;--mute:#8a867f;--line:#262a30;--accent:#ff7a1a;
  --c-hub:#ff7a1a;--c-note:#8fb8ff;--c-area:#5ec27a;--c-fm:#ffb347;--c-tier:#c08cff;
  --t-advantage:#5ec27a;--t-gap:#ef6a5e;--t-borrowed:#e6c84f;--t-trick:#4fd1d9;
  --s-has:#5ec27a;--s-dif:#e0a84a;--s-lack:#ef6a5e;--s-guess:#6c6a66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:linear-gradient(var(--bg) 70%,rgba(5,6,10,0))}
.title{margin-right:auto;min-width:0}
.title h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
.title h1 i{color:var(--accent);font-style:normal}
.title small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.btn{background:rgba(12,14,17,.9);border:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover,.btn:focus-visible,.btn.on{border-color:var(--accent);color:var(--accent);outline:none}
.find{position:relative;flex:0 1 260px}
.find input{width:100%;background:#07080a;border:1px solid var(--line);padding:6px 8px}
.find input:focus{border-color:var(--accent);outline:none}
#hits{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--panel);border:1px solid var(--line);max-height:50vh;overflow:auto}
#hits[hidden]{display:none}
#hits button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 8px;cursor:pointer}
#hits button:hover,#hits button:focus-visible{color:var(--accent);outline:none}
#hits .k{color:var(--mute);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block}
#count{font-size:11px;color:var(--mute);min-width:5ch}
svg#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.edge{stroke:#3a3f47;stroke-width:1;fill:none}
.edge.on{stroke:var(--accent);stroke-width:1.6}
.node{cursor:pointer;outline:none}
.node text{fill:var(--ink);font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.node.hubn text{font-size:12px;font-weight:700;letter-spacing:.08em}
.node .ring{fill:none;stroke:transparent;stroke-width:2}
.far .node:not(.hubn):not(.lit):not(:focus-visible) text,.far .node:not(.lit) .sb{display:none}
.node:hover .ring,.node:focus-visible .ring,.node.sel .ring{stroke:var(--ink)}
.dim .node:not(.lit){opacity:.18}
.dim .edge:not(.on){opacity:.12}
.legend{position:fixed;left:16px;bottom:16px;z-index:4;max-width:calc(100% - 32px)}
#legend{margin-bottom:8px;width:250px;max-width:100%;background:rgba(12,14,17,.94);border:1px solid var(--line);padding:10px 12px;max-height:60vh;overflow:auto}
#legend[hidden]{display:none}
#legend h2{margin:8px 0 4px;font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
#legend h2:first-child{margin-top:0}
#legend .row{display:flex;gap:8px;align-items:center;margin:2px 0;width:100%;background:none;border:0;padding:2px 0;text-align:left;font-size:12px}
#legend button.row{cursor:pointer}
#legend button.row:hover,#legend button.row.on{color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.pip{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
#legend p{margin:6px 0 0;color:var(--mute);font-size:11px}
.zoom{position:fixed;right:16px;bottom:16px;z-index:4;display:flex;gap:4px}
#ov{position:fixed;z-index:6;right:16px;top:64px;bottom:16px;width:400px;max-width:calc(100% - 32px);overflow:auto;background:rgba(12,14,17,.97);border:1px solid var(--line);padding:14px 16px 18px}
#ov[hidden]{display:none}
#ov .close{position:sticky;top:0;float:right;margin:-4px -6px 0 8px}
#ov .kick{color:var(--mute);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
#ov h2{margin:4px 0 8px;font-size:17px;line-height:1.3}
#ov h3{margin:14px 0 4px;font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
#ov p{margin:0 0 8px}
#ov ul{margin:0 0 8px;padding-left:18px}
#ov li{margin:2px 0}
#ov ul.plain{list-style:none;padding-left:0}
#ov .chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.chip{border:1px solid var(--line);padding:1px 7px;font-size:11px;border-radius:9px;color:var(--mute)}
.chip.t{color:var(--bg);border-color:transparent}
#ov .go{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-align:left}
.strip{display:flex;height:10px;width:100%;max-width:240px;margin:4px 0;border:1px solid var(--line)}
.strip span{display:block;height:100%}
table.tl{border-collapse:collapse;width:100%;font-size:12px}
table.tl td,table.tl th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tl th{color:var(--mute);font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
table.tl td.n{text-align:right;width:2.5em}
.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:var(--mute);font-size:10px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .bar{padding:8px 16px}
  .find{flex:1 1 100%;order:3}
  .hint{display:none}
  #ov{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:72vh;border-width:1px 0 0}
  #legend{width:230px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="title">
    <h1>Second <i>brain</i></h1>
    <small>Public notes · FirstMate showcase</small>
  </div>
  <a class="btn" href="../index.html">Site</a>
  <a class="btn" href="../core.html">Core logic</a>
  <div class="find">
    <label class="sr" for="q">Search the map</label>
    <input id="q" type="search" placeholder="Search notes, tags, parts…" autocomplete="off">
    <ul id="hits" hidden></ul>
  </div>
  <span id="count" aria-live="polite"></span>
</header>

<svg id="map" role="group" aria-label="Second brain map. Each node is a button; press Enter to read it."></svg>
<noscript><p style="position:fixed;top:80px;left:16px">This map needs JavaScript. The public notes are in <a href="notes/">notes/</a>.</p></noscript>

<div class="legend">
  <div id="legend" hidden></div>
  <button class="btn" id="legendBtn" type="button" aria-controls="legend" aria-expanded="false">Legend</button>
</div>
<div class="zoom">
  <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
  <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
  <button class="btn" id="zfit" type="button">Fit</button>
</div>
<div class="hint">Drag to pan · scroll to zoom · click a node to read it</div>

<aside id="ov" hidden aria-labelledby="ovTitle"></aside>

<script src="notes.js"></script>
<script>
/* Groups, tags and the nodes that are not wiki notes. Every sentence below is already on this site,
   in the harness landscape strip, or in a credited upstream source. Wiki notes come from notes.js. */
var GROUPS = {
  hub:  { label: "Second brain", color: "var(--c-hub)" },
  note: { label: "Wiki note (approved list)", color: "var(--c-note)" },
  area: { label: "Areas of interest", color: "var(--c-area)" },
  fm:   { label: "FirstMate in detail", color: "var(--c-fm)" },
  tier: { label: "Harness tier list", color: "var(--c-tier)" }
};
var TAGS = {
  advantage:       { label: "advantage", color: "var(--t-advantage)" },
  gap:             { label: "gap", color: "var(--t-gap)" },
  "borrowed-from": { label: "borrowed from", color: "var(--t-borrowed)" },
  trick:           { label: "trick", color: "var(--t-trick)" }
};
var CORE_NOTE = "From the Core logic page. The comparison there comes from two scout reports dated 2026-10-27 that read public docs, repos and papers; they did not test the tools.";

var EXTRA = [
  { id: "brain", group: "hub", hub: true, label: "Second brain",
    text: ["A public slice of the owner's private notes wiki, drawn as a map. Only notes on an approved list are copied, and a build step drops any line that names a private term, a local path, an email or a user name.",
           "Planned, not built: daily news items and job notes, added as drafts that go live only on the owner's weekly OK."],
    links: [["Approved list", "allowlist.txt"], ["Build script", "build.py"]],
    edges: ["g-area", "g-fm", "g-tier"] },

  { id: "g-area", group: "area", hub: true, label: "Areas of interest",
    text: ["The topics the owner writes about. Each links to the pages of this site that cover it, and to the wiki notes that sit under it."],
    edges: ["area-harness", "area-icm", "area-safety", "area-learning", "area-content"] },
  { id: "area-harness", group: "area", label: "Agent harnesses",
    text: ["A harness is everything around the model: what it reads, what it may do, and who checks it."],
    links: [["Core logic", "../core.html"], ["Harness flow", "../harness.html"], ["How it works", "../overview.html"], ["Harness flow map", "../maps/flow.html"]] },
  { id: "area-icm", group: "area", label: "Context engineering (ICM)",
    text: ["One rules file, linked into every agent tool, plus layers and rooms. The routing table says: for this kind of task, go to this folder and read these files first."],
    links: [["Context system", "../s04.html"], ["Memory and index", "../s06.html"], ["How skills work", "../skills.html"], ["ICM (Van Clief)", "https://github.com/RinDig/Interpretable-Context-Methodology"]] },
  { id: "area-safety", group: "area", label: "AI safety",
    text: ["Who may do what: seats, the A0 to A3 ladder and the permission matrix. Short hook scripts turn the most important rules into checks.",
           "swarm-referee is a public repo for the Apart Research AI Collusion Sprint 2026. One worker delivered a reviewed pull request to it."],
    links: [["Cast and authority", "../cast.html"], ["Hooks and rules", "../s05.html"], ["swarm-referee", "https://github.com/codeami/swarm-referee"]] },
  { id: "area-learning", group: "area", label: "Learning",
    text: ["Where the ideas come from: ICM, Kun Chen's agent stack and Matt Pocock's skills. And two checks that found the setup wrong, and what the owner did about each."],
    links: [["Influences", "../s10.html"], ["Testing in public", "../testing.html"], ["What works today", "../s09.html"]] },
  { id: "area-content", group: "area", label: "Content",
    text: ["The owner reviews every report and draft as an HTML page, not in a terminal."],
    links: [["Review surfaces", "../s07.html"], ["The story", "../story.html"], ["Changelog", "../changelog.html"]] },

  { id: "g-fm", group: "fm", hub: true, label: "FirstMate in detail",
    text: ["The twelve parts of the harness, the tricks this setup uses on top, and what it borrowed from others. Each part links to its place on the Core logic page."],
    links: [["Core logic", "../core.html#tree"], ["Upstream Firstmate (Kun Chen)", "https://github.com/kunchenguid/firstmate"]],
    edges: ["part-context", "part-rules", "part-skills", "part-memory", "part-hooks", "part-isolation", "part-orchestrator", "part-gate", "part-approval", "part-improve", "part-sync", "part-goals"] },
  { id: "part-context", group: "fm", label: "Always-loaded context", tags: ["gap"],
    text: ["Every tool reads one short map first, about 1.5k tokens. The supervisor also reads its rules file each session."],
    gap: "The supervisor's rules file is about 11k tokens, loaded before any work.",
    edges: ["global-memory-is-minimal", "icm-layer-ladder"] },
  { id: "part-rules", group: "fm", label: "Rules",
    text: ["One rules file, plus a written brief for each task. A routing table says which folder to read for which job."],
    edges: ["icm-routing-table-is-the-core-pattern", "kun-chen-agent-policy"] },
  { id: "part-skills", group: "fm", label: "Skills",
    text: ["Each skill's name and description load every turn. The body loads only when the trigger fits."],
    edges: ["progressive-disclosure", "popular-skills-are-not-good-skills"] },
  { id: "part-memory", group: "fm", label: "Memory and decay",
    text: ["At the end of a session, a \"stow\" step files lessons with decay tiers. Agent memory reaches the curated facts only after review."],
    edges: ["llmwiki-vs-rag", "compaction-is-an-implementation-detail"] },
  { id: "part-hooks", group: "fm", label: "Hooks",
    text: ["Scripts the tool must run. They block file writes through the shell, warn on text shaped like a key, and remind the agent to write a session note."] },
  { id: "part-isolation", group: "fm", label: "Isolation", tags: ["gap"],
    text: ["Each worker gets its own disposable git worktree. Each second mate gets its own home folder."],
    gap: "A worktree isolates files only. It does not fence the network or credentials.",
    edges: ["worktree-pooling"] },
  { id: "part-orchestrator", group: "fm", label: "Orchestrator",
    text: ["The owner talks to one supervisor. Workers are full agent sessions in visible windows. A watcher that uses no tokens wakes the supervisor when needed."],
    edges: ["first-mate", "long-running-loops"] },
  { id: "part-gate", group: "fm", label: "Review gate", tags: ["advantage"],
    text: ["A local gate runs review, tests, docs and lint before the branch leaves the machine. Shell tests check the rule files.",
           "On the Core logic page, Claude Code, OpenCode and Pi lack a gate like this; Omnigent and ICM do the job another way."],
    edges: ["validate-dont-review", "reproduce-bugs-end-to-end"] },
  { id: "part-approval", group: "fm", label: "Human approval points", tags: ["gap"],
    text: ["Only the owner merges, publishes, sends or spends. A decision is a task held for the owner. Reviews happen on HTML pages."],
    gap: "The approval and spend rules are prose. The model may not follow them. Omnigent writes the same ideas as enforced policy.",
    edges: ["human-in-the-loop"] },
  { id: "part-improve", group: "fm", label: "Self-improvement", tags: ["advantage", "gap"],
    text: ["A tool called backpass reads past transcripts and proposes rule edits. The owner applies each one by hand.",
           "On the Core logic page, Claude Code, OpenCode, Pi and Omnigent lack this. Harness-squared has it with no human step; Meta-Harness searches harness code instead."],
    gap: "A proposed edit is argued from past evidence. It is never tested by replaying a task.",
    edges: ["dialogue-freezes-into-skills"] },
  { id: "part-sync", group: "fm", label: "Sync across machines", tags: ["gap"],
    text: ["Links put the one map where five tools look for it. The supervisor's rules reach running sessions through git."],
    gap: "Agent memory does not sync between machines. (Guess: not checked.)" },
  { id: "part-goals", group: "fm", label: "Vision and goals", tags: ["advantage"],
    text: ["A private owner's layer holds current priorities and preferences, on top of the shared base.",
           "On the Core logic page, ICM, Claude Code, OpenCode, Pi, Warp, Omnigent and Harness-squared lack a goals layer."] },

  { id: "trick-routing", group: "fm", label: "Routing per task", tags: ["trick"],
    text: ["The map holds house rules, a \"who does what\" list, and a routing table. The routing table says: for this kind of task, go to this folder and read these files first."],
    links: [["Context system", "../s04.html"]],
    edges: ["part-rules", "icm-routing-table-is-the-core-pattern"] },
  { id: "trick-plain", group: "fm", label: "Plain-English check", tags: ["trick"],
    text: ["Scouts run a plain-English checker on their report before they say \"done\". It flags long sentences and vague words. It is one of the owner's two additions on top of upstream Firstmate."],
    links: [["How it works", "../overview.html"], ["Harness flow", "../harness.html"]],
    edges: ["g-fm"] },
  { id: "trick-decay", group: "fm", label: "Decay tiers", tags: ["trick"],
    text: ["/stow (upstream Firstmate) files durable facts into a curated learnings file, with decay tiers. Status on the Memory page: designed, not proven."],
    links: [["Memory and index", "../s06.html"]],
    edges: ["part-memory"] },
  { id: "trick-merge", group: "fm", label: "Live merge checks", tags: ["trick"],
    text: ["A guard. A script registers the pull request and its head commit, and arms a merge poll. The state comes from the forge. It does not come from the worker's message. A draft pull request is refused."],
    links: [["Skill map", "../maps/skills.html"]],
    edges: ["part-gate", "part-approval"] },
  { id: "trick-never", group: "fm", label: "Never-send list", tags: ["trick"],
    text: ["A short list of terms that must never leave the owner's machine. The build step for this page drops any note line that holds one of them, and also any line with a local path, an email or a user name."],
    links: [["Build script", "build.py"]],
    edges: ["part-approval", "brain"] },

  { id: "b-grill", group: "fm", label: "grill-with-docs", tags: ["borrowed-from"], from: "mattpocock/skills",
    text: ["A skill that interviews the owner until the intent is written down in their own words. The idea is from Matt Pocock's skills, which get the agent to ask detailed questions about what you are building."],
    links: [["mattpocock/skills", "https://github.com/mattpocock/skills"], ["Influences", "../s10.html"]],
    edges: ["pocock-steers-with-skills-kun-builds-machinery", "g-fm"] },
  { id: "b-shell", group: "fm", label: "Map shell", tags: ["borrowed-from"], from: "EricTechPro/super-board",
    text: ["The interactive Skill map and Harness flow map use the map shell from super-board by EricTechPro (MIT)."],
    links: [["super-board", "https://github.com/EricTechPro/super-board"], ["Skill map", "../maps/skills.html"]],
    edges: ["g-fm"] },
  { id: "b-arms", group: "fm", label: "ARMS framework", tags: ["borrowed-from"], from: "RoboNuggets",
    text: ["A framework from Jay E (RoboNuggets) that splits an agent workspace into four layers: Applications, Routines, Memory, Skills."],
    edges: ["g-fm"] },
  { id: "b-pi", group: "fm", label: "Pi ideas", tags: ["borrowed-from"], from: "the Pi ecosystem",
    text: ["Ideas from the Pi coding agent and its packages. The compaction note cites a Pi extension for server-side compaction."],
    links: [["Pi", "https://github.com/earendil-works/pi"]],
    edges: ["compaction-is-an-implementation-detail", "g-fm", "tier-pi"] },

  { id: "g-tier", group: "tier", hub: true, label: "Harness tier list",
    text: ["Eleven setups marked on the same twelve harness parts. Has it, does it differently, lacks it, or a guess the scout could not confirm.",
           "The counts treat all twelve parts as equal. They show coverage, not quality. From a scout report dated 2026-10-27 that read public docs, repos and papers; the tools were not tested."] }
];

/* name, has, different, lacks, guess, source link (null: name and score only) */
var TIER = [
  ["tier-composite", "Our composite", 10, 2, 0, 0, null],
  ["tier-kun", "Kun Chen stack", 8, 4, 0, 0, "https://github.com/kunchenguid/firstmate"],
  ["tier-troupe", "Troupe design", 7, 2, 3, 0, null],
  ["tier-cc", "Claude Code", 7, 2, 3, 0, "https://code.claude.com/docs/en/memory.md"],
  ["tier-warp", "Warp", 5, 1, 5, 1, "https://docs.warp.dev/platform/harnesses/warp-agent.md"],
  ["tier-omni", "Databricks Omnigent", 4, 5, 2, 1, "https://github.com/omnigent-ai/omnigent"],
  ["tier-opencode", "OpenCode", 4, 3, 4, 1, "https://opencode.ai/docs/rules/"],
  ["tier-icm", "ICM (Van Clief)", 3, 5, 3, 1, "https://arxiv.org/abs/2603.16021"],
  ["tier-h2", "Google Harness-squared", 3, 4, 5, 0, "https://github.com/google-research/harness2"],
  ["tier-pi", "Pi", 3, 3, 6, 0, "https://github.com/earendil-works/pi"],
  ["tier-meta", "Stanford Meta-Harness", 1, 6, 4, 1, "https://github.com/stanford-iris-lab/meta-harness"]
];
var TIER_EDGES = { "tier-composite": ["g-fm"], "tier-kun": ["first-mate"], "tier-icm": ["icm-layer-ladder"] };

/* Which areas each wiki note sits under. A note not listed here hangs off the hub. */
var NOTE_AREAS = {
  "first-mate": ["area-harness"], "worktree-pooling": ["area-harness"], "validate-dont-review": ["area-harness"],
  "kun-chen-agent-policy": ["area-harness", "area-learning"], "pocock-steers-with-skills-kun-builds-machinery": ["area-harness", "area-learning"],
  "popular-skills-are-not-good-skills": ["area-harness", "area-safety"], "progressive-disclosure": ["area-icm"],
  "dialogue-freezes-into-skills": ["area-icm", "area-content"], "llmwiki-vs-rag": ["area-icm", "area-learning"],
  "second-brain-is-a-context-layer": ["area-icm", "area-learning"], "mini-brains-not-one-brain": ["area-icm", "area-content"],
  "icm-routing-table-is-the-core-pattern": ["area-icm"], "icm-layer-ladder": ["area-icm"],
  "icm-storage-is-not-active-context": ["area-icm", "area-safety"], "structure-decides-what-matters": ["area-icm", "area-content"],
  "right-size-the-model": ["area-harness"], "reproduce-bugs-end-to-end": ["area-harness"], "long-running-loops": ["area-harness"],
  "human-in-the-loop": ["area-safety"], "global-memory-is-minimal": ["area-icm"],
  "compaction-is-an-implementation-detail": ["area-harness"], "agent-ergonomics": ["area-harness"]
};

/* ---------- assemble the graph ---------- */
var nodes = [], byId = {}, edges = [], seen = {};
function addNode(n) { n.tags = n.tags || []; nodes.push(n); byId[n.id] = n; }
function addEdge(a, b) {
  if (!byId[a] || !byId[b] || a === b) return;
  var k = a < b ? a + "|" + b : b + "|" + a;
  if (seen[k]) return;
  seen[k] = 1; edges.push({ a: byId[a], b: byId[b] });
}
EXTRA.forEach(addNode);
TIER.forEach(function (t) {
  addNode({ id: t[0], group: "tier", label: t[1], strip: t.slice(2, 6), src: t[6] });
});
(typeof BRAIN_NOTES === "undefined" ? [] : BRAIN_NOTES).forEach(function (n) {
  addNode({ id: n.id, group: "note", label: n.title, note: n, tags: [] });
});
EXTRA.forEach(function (n) { (n.edges || []).forEach(function (e) { addEdge(n.id, e); }); });
TIER.forEach(function (t) { addEdge("g-tier", t[0]); (TIER_EDGES[t[0]] || []).forEach(function (e) { addEdge(t[0], e); }); });
nodes.forEach(function (n) {
  if (n.group !== "note") return;
  n.note.links.forEach(function (l) { addEdge(n.id, l); });
  var areas = NOTE_AREAS[n.id] || ["brain"];
  areas.forEach(function (a) { addEdge(n.id, a); });
});
nodes.forEach(function (n) { n.nb = []; });
edges.forEach(function (e) { e.a.nb.push(e.b); e.b.nb.push(e.a); });

/* ---------- layout: seeded by group, then a fixed number of force steps (same picture every load) ---------- */
(function layout() {
  var seed = 7;

  nodes.forEach(function (n) {
    var a = anchor[n.group];
    n.x = a[0] + (rnd() - 0.5) * 160; n.y = a[1] + (rnd() - 0.5) * 160; n.vx = 0; n.vy = 0;

      var want = (e.a.hub || e.b.hub) ? 110 : 85, f = (d - want) * 0.03;

    });

      var a = anchor[n.group];
      n.vx -= (n.x - a[0]) * 0.008; n.vy -= (n.y - a[1]) * 0.008;
      if (n.id === "brain") { n.vx = n.vy = 0; n.x = 0; n.y = 0; return; }
      var s = Math.min(12, Math.sqrt(n.vx * n.vx + n.vy * n.vy)) * cool, m = Math.sqrt(n.vx * n.vx + n.vy * n.vy) || 1;
      n.x += n.vx / m * s; n.y += n.vy / m * s; n.vx *= 0.5; n.vy *= 0.5;
    });
  }
})();

/* ---------- draw ---------- */
var NS = "http://www.w3.org/2000/svg";
var svg = document.getElementById("map");
function sv(tag, attrs, parent) {

}
var root = sv("g", {}, svg), gE = sv("g", {}, root), gN = sv("g", {}, root);
edges.forEach(function (e) {
  e.el = sv("line", { "class": "edge" }, gE);
});
var SCOL = ["var(--s-has)", "var(--s-dif)", "var(--s-lack)", "var(--s-guess)"];
nodes.forEach(function (n) {
  var r = n.id === "brain" ? 15 : n.hub ? 11 : 6.5;
  var g = sv("g", { "class": "node" + (n.hub ? " hubn" : ""), tabindex: "0", role: "button",
    "aria-label": n.label + ", " + GROUPS[n.group].label + (n.tags.length ? ", tagged " + n.tags.join(", ") : "") }, gN);
  sv("circle", { r: r, fill: GROUPS[n.group].color }, g);
  sv("circle", { "class": "ring", r: r + 3 }, g);
  n.tags.forEach(function (t, i) {
    var ang = -Math.PI / 4 + i * 0.75;
    sv("rect", { x: Math.cos(ang) * (r + 5) - 3, y: Math.sin(ang) * (r + 5) - 3, width: 6, height: 6, rx: 1.5, fill: TAGS[t].color }, g);
  });
  var lbl = sv("text", { x: 0, y: r + 13, "text-anchor": "middle" }, g);
  lbl.textContent = n.label.length > 26 ? n.label.slice(0, 24) + "…" : n.label;
  if (n.strip) {
    var x = -18;
    n.strip.forEach(function (c, i) {
      if (!c) return;
      sv("rect", { "class": "sb", x: x, y: r + 17, width: c * 3, height: 3, fill: SCOL[i] }, g);
      x += c * 3;
    });
  }
  n.el = g;
  g.addEventListener("click", function (ev) { ev.stopPropagation(); open(n); });
  g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(n); } });
  g.addEventListener("mouseenter", function () { if (!sel && !query) light([n].concat(n.nb)); });
  g.addEventListener("mouseleave", function () { if (!sel && !query) light(null); });
});

/* ---------- highlight ---------- */
var sel = null, query = "", tagOn = null;
function light(list) {
  var on = {};
  (list || []).forEach(function (n) { on[n.id] = 1; });
  svg.classList.toggle("dim", !!list);
  nodes.forEach(function (n) { n.el.classList.toggle("lit", !!on[n.id]); n.el.classList.toggle("sel", n === sel); });
  edges.forEach(function (e) { e.el.classList.toggle("on", !!(list && on[e.a.id] && on[e.b.id] && (!sel || e.a === sel || e.b === sel))); });
}
function relight() {
  if (sel) light([sel].concat(sel.nb));
  else if (query || tagOn) light(nodes.filter(matches));
  else light(null);
}

/* ---------- pan and zoom ---------- */
var view = { x: 0, y: 0, k: 1 };
/* Zoom moves the nodes apart; it does not scale them, so labels stay readable at any zoom.

var tall = false;

function wy(n) { return tall ? n.x : n.y; }
function sx(n) { return wx(n) * view.k + view.x; }
function sy(n) { return wy(n) * view.k + view.y; }
function apply() {
  svg.classList.toggle("far", view.k < 0.6);
  nodes.forEach(function (n) { n.el.setAttribute("transform", "translate(" + sx(n) + "," + sy(n) + ")"); });
  edges.forEach(function (e) {
    e.el.setAttribute("x1", sx(e.a)); e.el.setAttribute("y1", sy(e.a));
    e.el.setAttribute("x2", sx(e.b)); e.el.setAttribute("y2", sy(e.b));

}
function fit() {
  // Fit node centres into the free screen area: below the bar, above the buttons, right of an open legend.
  var w = svg.clientWidth, h = svg.clientHeight, top = document.querySelector(".bar").offsetHeight + 12;
  var pad = w > 760 ? 60 : 24, left = (!lg.hidden && w > 760 ? lg.getBoundingClientRect().right : 0) + pad;
  tall = h > w;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(function (n) { x0 = Math.min(x0, wx(n)); y0 = Math.min(y0, wy(n)); x1 = Math.max(x1, wx(n)); y1 = Math.max(y1, wy(n)); });

  view.x = left + (availW - (x1 - x0) * view.k) / 2 - x0 * view.k;

svg.addEventListener("wheel", function (ev) { ev.preventDefault(); zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX, ev.clientY); }, { passive: false });
var ptrs = {}, last = null, moved = 0;
svg.addEventListener("pointerdown", function (ev) {
  if (ev.target.closest && ev.target.closest(".node")) return;
  ptrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
  svg.setPointerCapture(ev.pointerId); svg.classList.add("drag"); moved = 0;
});

  if (ids.length === 2) {

    var d0 = Math.hypot(p.x - o.x, p.y - o.y), d1 = Math.hypot(ev.clientX - o.x, ev.clientY - o.y);
    if (d0 > 0) zoomAt(d1 / d0, (ev.clientX + o.x) / 2, (ev.clientY + o.y) / 2);
  } else {
    view.x += ev.clientX - p.x; view.y += ev.clientY - p.y; apply();
  }
  moved += Math.abs(ev.clientX - p.x) + Math.abs(ev.clientY - p.y);
  p.x = ev.clientX; p.y = ev.clientY;
});
function up(ev) { delete ptrs[ev.pointerId]; if (!Object.keys(ptrs).length) svg.classList.remove("drag"); }
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
svg.addEventListener("click", function () { if (moved < 4 && sel) close(); });
var mid = function () { return [svg.clientWidth / 2, svg.clientHeight / 2]; };
document.getElementById("zin").onclick = function () { var m = mid(); zoomAt(1.25, m[0], m[1]); };
document.getElementById("zout").onclick = function () { var m = mid(); zoomAt(0.8, m[0], m[1]); };
document.getElementById("zfit").onclick = fit;
window.addEventListener("resize", fit);

/* ---------- overlay ---------- */
var ov = document.getElementById("ov");
function h(tag, cls, text, parent) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function linkify(text, parent) {

}
function clean(s) { return s.replace(/\[\[([^\]]+)\]\]/g, "$1").replace(/\*\*/g, ""); }

  var ul = null;
  text.split("\n").forEach(function (ln) {
    ln = clean(ln.trim());
    if (!ln) { ul = null; return; }
    if (/^[-*] /.test(ln)) { ul = ul || h("ul", null, null, parent); linkify(ln.slice(2), h("li", null, null, ul)); }
    else { ul = null; linkify(ln, h("p", null, null, parent)); }
  });
}
function chips(n, parent) {
  if (!n.tags.length && !(n.note && n.note.tags.length)) return;
  var c = h("div", "chips", null, parent);
  n.tags.forEach(function (t) { var s = h("span", "chip t", TAGS[t].label + (t === "borrowed-from" && n.from ? " " + n.from : ""), c); s.style.background = TAGS[t].color; });
  if (n.note) n.note.tags.forEach(function (t) { h("span", "chip", t, c); });

  var d = h("div", "strip", null, parent);
  d.setAttribute("role", "img");
  d.setAttribute("aria-label", "has " + s[0] + ", different " + s[1] + ", lacks " + s[2] + ", guess " + s[3]);
  s.forEach(function (c, i) { var sp = h("span", null, null, d); sp.style.width = (c / 12 * 100) + "%"; sp.style.background = SCOL[i]; });

  b.onclick = function () { open(n); centre(n); };
  return b;
}
function centre(n) {

}
/* The address follows the open node (#<node-id>), so a link can be shared and Back steps through nodes. */
function mark(id) {

}
function open(n) {

  sel = n; relight();
  ov.textContent = "";
  var x = h("button", "btn close", "Close", ov); x.type = "button"; x.onclick = close;
  h("div", "kick", n.note && n.note.site ? "Site note (written for this page)" : GROUPS[n.group].label, ov);
  var t = h("h2", null, n.label, ov); t.id = "ovTitle";
  chips(n, ov);
  if (n.note) {
    h("h3", null, "Claim", ov); prose(n.note.claim, ov);
    if (n.note.evidence) { h("h3", null, "Evidence", ov); prose(n.note.evidence, ov); }
    if (n.note.source) { h("h3", null, "Source", ov); linkify(n.note.source, h("p", null, null, ov)); }
    var a = h("a", null, "Read the public copy of this note", h("p", null, null, ov)); a.href = "notes/" + n.id + ".md";
  }
  (n.text || []).forEach(function (p) { h("p", null, p, ov); });
  if (n.gap) { h("h3", null, "Gap", ov); h("p", null, n.gap, ov); }
  if (n.id.indexOf("part-") === 0) {
    h("p", "kick", CORE_NOTE, ov);
    n.links = [["Open this part on Core logic", "../core.html#" + n.id]];
  }
  if (n.strip) {
    h("h3", null, "Strip (12 parts)", ov); stripEl(n.strip, ov);
    h("p", null, "Has " + n.strip[0] + " · Different " + n.strip[1] + " · Lacks " + n.strip[2] + " · Guess " + n.strip[3], ov);
    if (n.src) n.links = [["Primary source", n.src]];
    else h("p", "kick", "Name and score only on this page.", ov);
  }
  if (n.id === "g-tier") {
    var tb = h("table", "tl", null, ov), hr = h("tr", null, null, h("thead", null, null, tb));
    ["System", "Strip", "H", "D", "L", "G"].forEach(function (c) { h("th", null, c, hr); });
    var body = h("tbody", null, null, tb);
    TIER.forEach(function (r) {
      var tr = h("tr", null, null, body);
      goBtn(byId[r[0]], h("td", null, null, tr));
      stripEl(r.slice(2, 6), h("td", null, null, tr));
      r.slice(2, 6).forEach(function (c) { h("td", "n", String(c), tr); });
    });
  }
  if (n.links && n.links.length) {

    var ul = h("ul", null, null, ov);
    n.links.forEach(function (l) {

    });
  }
  if (n.nb.length) {
    h("h3", null, "Connected (" + n.nb.length + ")", ov);
    var cl = h("ul", "plain", null, ov);
    n.nb.slice().sort(function (p, q) { return p.label < q.label ? -1 : 1; }).forEach(function (m) { goBtn(m, h("li", null, null, cl)); });

function close() {
  var was = sel;

  sel = null; ov.hidden = true; relight();

}
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !ov.hidden) close(); });

/* ---------- search ---------- */
var q = document.getElementById("q"), hits = document.getElementById("hits"), count = document.getElementById("count");
function hay(n) {
  var s = [n.label, (n.text || []).join(" "), n.gap || "", n.tags.join(" "), n.from || "", GROUPS[n.group].label];
  if (n.note) s.push(n.note.claim, n.note.evidence, n.note.source, n.note.tags.join(" "));
  return s.join(" ").toLowerCase();
}
nodes.forEach(function (n) { n.hay = hay(n); });
function matches(n) {

}
function search() {
  query = q.value.trim().toLowerCase();
  var found = query || tagOn ? nodes.filter(matches) : [];
  hits.textContent = "";
  found.slice(0, 12).forEach(function (n) {
    var b = h("button", null, null, h("li", null, null, hits)); b.type = "button";
    h("span", "k", GROUPS[n.group].label, b); b.appendChild(document.createTextNode(n.label));
    b.onclick = function () { hits.hidden = true; open(n); centre(n); };
  });

q.addEventListener("input", search);
q.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter") { var f = hits.querySelector("button"); if (f) f.click(); }
  if (ev.key === "Escape") { q.value = ""; search(); }
});
q.addEventListener("focus", function () { if (query) hits.hidden = !hits.firstChild; });
document.addEventListener("click", function (ev) { if (!ev.target.closest(".find")) hits.hidden = true; });

/* ---------- legend ---------- */
var lg = document.getElementById("legend"), lb = document.getElementById("legendBtn");
(function buildLegend() {
  h("h2", null, "Groups", lg);
  Object.keys(GROUPS).forEach(function (k) {
    var r = h("div", "row", null, lg), d = h("span", "dot", null, r); d.style.background = GROUPS[k].color;
    r.appendChild(document.createTextNode(GROUPS[k].label + " (" + nodes.filter(function (n) { return n.group === k; }).length + ")"));
  });
  h("h2", null, "Tags · click to filter", lg);
  Object.keys(TAGS).forEach(function (k) {
    var b = h("button", "row", null, lg), d = h("span", "pip", null, b); b.type = "button"; d.style.background = TAGS[k].color;
    b.appendChild(document.createTextNode(TAGS[k].label + " (" + nodes.filter(function (n) { return n.tags.indexOf(k) >= 0; }).length + ")"));
    b.setAttribute("aria-pressed", "false");
    b.onclick = function () {
      tagOn = tagOn === k ? null : k;
      lg.querySelectorAll("button.row").forEach(function (o) { o.classList.toggle("on", o === b && !!tagOn); o.setAttribute("aria-pressed", o === b && tagOn ? "true" : "false"); });
      if (sel) close();
      search();
    };
  });
  h("h2", null, "Tier strip", lg);
  ["Has", "Different", "Lacks", "Guess"].forEach(function (s, i) {
    var r = h("div", "row", null, lg), d = h("span", "pip", null, r); d.style.background = SCOL[i];
    r.appendChild(document.createTextNode(s));
  });
  h("p", null, "Wiki notes are copies of approved notes only, plus three talk-mode notes written for this site. Lines naming private terms, local paths, emails or user names are dropped at build time.", lg);
})();
function showLegend(on) { lg.hidden = !on; lb.setAttribute("aria-expanded", on ? "true" : "false"); lb.classList.toggle("on", on); }
lb.onclick = function () { showLegend(lg.hidden); };
showLegend(window.innerWidth >= 1400);

fit();
/* A link such as brain/index.html#ste100-mode opens that node, on load and on Back or Forward. */
function fromHash() {
  var n = byId[decodeURIComponent(location.hash.slice(1))];
  if (n) { open(n); centre(n); } else if (sel) close();
}
window.addEventListener("popstate", fromHash);
fromHash();
